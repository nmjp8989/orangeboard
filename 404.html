<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14191b">
  <title>Page not found | Craftwell</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #14191b; color: #fff; padding: 2rem; }
    main { max-width: 34rem; }
    .brand { color: #f4b92e; letter-spacing: .2em; font-size: .875rem; font-weight: 700; }
    h1 { margin: 1rem 0; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; }
    p { font-size: 1rem; line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; border-radius: .4rem; padding: .9rem 1.25rem; color: #14191b; background: #f4b92e; font-weight: 700; text-decoration: none; }
    a:hover { background: #ffda72; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">CRAFTWELL</p>
    <h1>Page not found.</h1>
    <p>This address is unavailable. Explore our home renovation services and book a consultation on the Craftwell homepage.</p>
    <a id="home-link" href="/">Go to the homepage</a>
  </main>
  <script>
    (() => {
      const pathname = window.location.pathname;
      const projectMatch = pathname.match(/^\/orangeboard(?:\/|$)/i);
      const base = projectMatch ? pathname.slice(0, '/orangeboard'.length) + '/' : '/';
      const relativePath = pathname.slice(projectMatch ? '/orangeboard'.length : 0)
        .replace(/^\/+|\/+$/g, '').toLowerCase();
      const destinations = {
        'about': 'planning',
        'why-choose-us': 'planning',
        'services': 'services',
        'services/kitchen-renovations': 'services',
        'services/bathroom-renovations': 'services',
        'services/basement-renovations': 'services',
        'projects': 'transformations',
        'process': 'process',
        'contact': 'consultation',
        'estimate': 'consultation',
        'request-estimate': 'consultation',
        'reviews': 'reviews'
      };
      document.getElementById('home-link').href = base;
      const matchedRoute = Object.keys(destinations).find(route =>
        relativePath === route || relativePath === route + '.html' ||
        relativePath === route + '/index.html');
      if (matchedRoute) {
        window.location.replace(base + window.location.search + '#' + destinations[matchedRoute]);
      }
    })();
  </script>
</body>
</html>
